name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate project imports
        run: |
          python -c "from app.main import app; print('FastAPI import OK')"
          python -c "from app.evaluation.evaluator import evaluate_all; print('Evaluator import OK')"
          python -c "import dashboard.data_service; print('Dashboard import OK')"

      - name: Check project structure and configuration
        run: python scripts/check_project.py

      - name: Check local documentation links
        run: python scripts/check_docs.py

      - name: Validate n8n workflow exports
        run: python scripts/validate_n8n_workflows.py

      - name: Evaluate demo scenarios
        run: python scripts/evaluate_demo_scenarios.py

      - name: Run tests
        run: python -m pytest -q
